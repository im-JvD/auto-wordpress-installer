services:
  db:
    image: ${DB_IMAGE:-mariadb:10.11}
    container_name: wp_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - wp_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Nginx Profile Services (Nginx + PHP-FPM)
  wordpress:
    image: ${WP_IMAGE:-wordpress:php8.3-fpm-alpine}
    container_name: wp_app
    restart: unless-stopped
    profiles: ["nginx"]
    entrypoint: ${WP_ENTRYPOINT:-docker-entrypoint.sh php-fpm}
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_TABLE_PREFIX: ${WP_TABLE_PREFIX:-wp_}
    volumes:
      - wp_data:/var/www/html
      - ./php/custom.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    networks:
      - wp_network
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: wp_nginx
    restart: unless-stopped
    profiles: ["nginx"]
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - wp_data:/var/www/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    networks:
      - wp_network
    depends_on:
      - wordpress

  # OpenLiteSpeed Profile Service (OLS + LSPHP + LSCache)
  openlitespeed:
    image: ${OLS_IMAGE:-litespeedtech/openlitespeed:latest-lsphp83}
    container_name: wp_ols
    restart: unless-stopped
    profiles: ["ols"]
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - wp_data:/var/www/vhosts/localhost/html
      - ./ols/conf/httpd_config.conf:/usr/local/lsws/conf/httpd_config.conf
      - ./ols/conf/vhosts/Example/vhconf.conf:/usr/local/lsws/conf/vhosts/Example/vhconf.conf
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    environment:
      - TZ=UTC
    networks:
      - wp_network
    depends_on:
      db:
        condition: service_healthy

  certbot:
    image: certbot/certbot:latest
    container_name: wp_certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'"
    networks:
      - wp_network

volumes:
  wp_data:
    name: wp_data
  db_data:
    name: wp_db_data

networks:
  wp_network:
    name: wp_network
    driver: bridge
